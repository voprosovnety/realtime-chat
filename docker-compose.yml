x-database-environment: &database-environment
  POSTGRES_DB: ${POSTGRES_DB:-messenger}
  POSTGRES_USER: ${POSTGRES_USER:-messenger}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-messenger}

x-app-environment: &app-environment
  <<: *database-environment
  APP_ENV: prod
  APP_DEBUG: 0
  MERCURE_URL: http://mercure/.well-known/mercure
  MERCURE_PUBLIC_URL: ${MERCURE_PUBLIC_URL:-http://localhost/.well-known/mercure}
  MERCURE_JWT_SECRET: ${MERCURE_JWT_SECRET:?Set MERCURE_JWT_SECRET in the root .env}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

services:
  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    ports:
      - "${NGINX_PORT:-80}:80"
    depends_on:
      php:
        condition: service_healthy
      mercure:
        condition: service_started
    volumes:
      - uploads:/var/www/uploads
    restart: unless-stopped

  php:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    working_dir: /var/www/backend/app
    volumes:
      - jwt_keys:/var/www/backend/app/config/jwt
      - uploads:/var/www/uploads
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment: *database-environment
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  mercure:
    image: dunglas/mercure:latest
    environment:
      SERVER_NAME: ":80"
      MERCURE_PUBLISHER_JWT_KEY: ${MERCURE_JWT_SECRET:?Set MERCURE_JWT_SECRET in the root .env}
      MERCURE_SUBSCRIBER_JWT_KEY: ${MERCURE_JWT_SECRET:?Set MERCURE_JWT_SECRET in the root .env}
      MERCURE_EXTRA_DIRECTIVES: |
        cors_origins ${CORS_ORIGINS:-*}
    restart: unless-stopped

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    working_dir: /var/www/backend/app
    command: ["php", "bin/console", "app:scheduled-messages:dispatch", "--loop", "--interval", "30"]
    volumes:
      - jwt_keys:/var/www/backend/app/config/jwt
      - uploads:/var/www/uploads
    environment:
      <<: *app-environment
      INITIALIZE_APP: 0
    depends_on:
      php:
        condition: service_healthy
      mercure:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
  jwt_keys:
  uploads:
